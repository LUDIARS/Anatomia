# Multi-project local Anatomia API. Port ownership and topology source.
services:
  - code: anatomia
    name: Anatomia
    viewer:
      enabled: true
      entry_path: /
    tier: personal
    project_code: anatomia
    component: backend
    repo: LUDIARS/Anatomia
    runtime: node
    cwd: ${ARS_ROOT}/Anatomia
    # No --home: the registry (projects.json) + cache are the user's single home
    # <os.homedir()>/.anatomia, the same one the CLI resolves from any cwd, so the
    # panel, the hooks and `anatomia` commands never see different registries.
    # This repo keeps no .anatomia/projects.json, or resolveHome() would pick it first.
    command: node bin/anatomia.mjs web --port 4200
    port: 4200
    frontend_url: http://127.0.0.1:4200
    autostart: true
    restart_policy: on-failure
    provides:
      ANATOMIA_URL: http://127.0.0.1:${port}
    health:
      type: tcp
      interval_sec: 30
      grace_period_sec: 15
